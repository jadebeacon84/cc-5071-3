<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Convex Contact Geometry Kit</title>
  <style>
    :root {
      --bg: #0f141b;
      --panel: #161d27;
      --panel-2: #1d2632;
      --line: #2a3645;
      --text: #d7e0ea;
      --muted: #8aa0b4;
      --accent: #4fc3f7;
      --good: #66d18e;
      --warn: #f2c14e;
      --bad: #ef7d7d;
      --body: #6fb1f0;
      --static: #9fb4c7;
      --contact: #ff8a5c;
      --normal: #ffe08a;
      --support: #c792ea;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; }
    .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    label { color: var(--muted); }
    select, button {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 5px 10px;
      font: inherit;
      cursor: pointer;
    }
    button:hover, select:hover { border-color: var(--accent); }
    button.active { border-color: var(--accent); color: var(--accent); }
    main { flex: 1; display: flex; min-height: 0; }
    #stage { flex: 1; position: relative; min-width: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    aside {
      width: 360px;
      background: var(--panel);
      border-left: 1px solid var(--line);
      overflow-y: auto;
      padding: 12px 14px;
    }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 16px 0 8px; }
    h2:first-child { margin-top: 0; }
    .kv { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
    .kv span:first-child { color: var(--muted); }
    .badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; }
    .badge.ok { background: rgba(102,209,142,0.15); color: var(--good); }
    .badge.bad { background: rgba(239,125,125,0.15); color: var(--bad); }
    .badge.method { background: rgba(79,195,247,0.15); color: var(--accent); }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--line); }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--muted); font-weight: 500; }
    .legend { display: grid; grid-template-columns: 14px 1fr; gap: 4px 8px; align-items: center; }
    .swatch { width: 12px; height: 12px; border-radius: 3px; }
    .muted { color: var(--muted); }
    .issue { color: var(--bad); font-size: 12px; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
    .toggle { display: flex; align-items: center; gap: 6px; }
  </style>
</head>
<body>
  <header>
    <h1>Convex Contact Kit</h1>
    <div class="group">
      <label>Scene</label>
      <select id="scene"></select>
    </div>
    <div class="group">
      <button id="play" class="active">Pause</button>
      <button id="step">Step</button>
      <button id="reset">Reset</button>
    </div>
    <div class="group">
      <label>Speed</label>
      <select id="speed">
        <option value="0.25">0.25x</option>
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
        <option value="2">2x</option>
      </select>
    </div>
    <div class="group">
      <label class="toggle"><input type="checkbox" id="show-support" checked /> Support</label>
      <label class="toggle"><input type="checkbox" id="show-epa" checked /> EPA</label>
      <label class="toggle"><input type="checkbox" id="show-manifold" checked /> Manifold</label>
      <label class="toggle"><input type="checkbox" id="show-aabb" /> AABB</label>
    </div>
  </header>
  <main>
    <div id="stage"><canvas id="canvas"></canvas></div>
    <aside id="panel"></aside>
  </main>
  <script type="module" src="renderer/app.js"></script>
</body>
</html>
